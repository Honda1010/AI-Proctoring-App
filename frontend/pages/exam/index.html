<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self' data:; media-src 'self' blob:;" />
  <title>Exam — Lumina AI</title>
  <link rel="stylesheet" href="../../assets/design-tokens.css" />
  <link rel="stylesheet" href="../../assets/components.css" />
  <link rel="stylesheet" href="./exam.css" />
  <script defer src="./exam.js"></script>
</head>
<body>

  <!-- Loading skeleton overlay (visible until IPC resolves) -->
  <div class="skeleton-overlay" id="skeletonOverlay">
    <div class="skeleton-spinner"></div>
  </div>

  <!-- Fixed header -->
  <header class="exam-header" id="examHeader">
    <h1 class="exam-title" id="examTitle">Loading…</h1>
    <div class="timer-chip" id="timerChip">
      <span id="timerDisplay">--:--:--</span>
    </div>
    <button class="btn btn-submit-exam" id="submitExamBtn" type="button">Submit Exam</button>
  </header>

  <!-- Main content layout -->
  <main class="exam-layout">

    <!-- Question panel -->
    <section class="question-panel">
      <div class="question-badge" id="questionBadge">Question 1 of —</div>
      <p class="question-text" id="questionText"></p>
      <ul class="choices-list" id="choicesList" role="radiogroup" aria-label="Answer choices"></ul>
      <button class="flag-btn" id="flagBtn" type="button" aria-label="Flag this question for review">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 2v12M3 2h8l-2 3 2 3H3" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Flag for review
      </button>
    </section>

    <!-- Proctoring aside panel -->
    <aside class="proctoring-panel" id="proctoringPanel" aria-label="Proctoring panel">
      <div class="webcam-section">
        <video class="webcam-feed" id="webcamFeed" autoplay muted playsinline
               aria-label="Live webcam feed"></video>
        <span class="live-badge" aria-label="Live feed indicator">LIVE FEED</span>
        <div class="camera-unavailable hidden" id="cameraUnavailable" aria-live="polite">
          Camera unavailable
        </div>
      </div>

      <div class="ai-status-rows" aria-label="AI monitoring status">
        <div class="status-row">
          <span class="status-label">Face Detection</span>
          <span class="status-indicator active">Active</span>
        </div>
        <div class="status-row">
          <span class="status-label">Eye Tracking</span>
          <span class="status-indicator active">Active</span>
        </div>
        <div class="status-row">
          <span class="status-label">Object Detection</span>
          <span class="status-indicator active">Active</span>
        </div>
        <div class="status-row">
          <span class="status-label">Face Anti-Spoofing</span>
          <span class="status-indicator active">Active</span>
        </div>
        <div class="status-row">
          <span class="status-label">Multiple Faces</span>
          <span class="status-indicator inactive">Inactive</span>
        </div>
      </div>
    </aside>

  </main>

  <!-- Bottom navigator bar -->
  <nav class="exam-navigator" id="examNavigator" aria-label="Question navigator">
    <button id="prevBtn" class="btn btn-nav" type="button" aria-label="Previous question">
      ← Previous
    </button>
    <div class="pills-container" id="pillsContainer" role="list" aria-label="Question list"></div>
    <div class="jump-to-group">
      <label for="jumpInput">Jump to</label>
      <input type="number" id="jumpInput" min="1" class="jump-input" aria-label="Jump to question number" />
    </div>
    <button id="nextBtn" class="btn btn-nav" type="button" aria-label="Next question">
      Next Question →
    </button>
  </nav>

  <!-- Confirmation modal -->
  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true"
       aria-labelledby="modalTitle" aria-describedby="modalMessage">
    <div class="modal-glass">
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-message" id="modalMessage"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modalCancelBtn" type="button">Cancel</button>
        <button class="btn btn-primary" id="modalConfirmBtn" type="button">Submit</button>
      </div>
    </div>
  </div>

  <!-- Error banner -->
  <div class="error-banner hidden" id="errorBanner" role="alert" aria-live="assertive">
    <span id="errorBannerText"></span>
    <button class="btn btn-retry" id="retryBtn" type="button">Retry</button>
  </div>

</body>
</html>
